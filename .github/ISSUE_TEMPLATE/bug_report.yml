name: Bug report
description: Report a problem with Portfree that you can reproduce
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please fill in as much of this form as you can; a reproduction we can run is the fastest route to a fix.

        If this is a security vulnerability, stop and report it privately through [SECURITY.md](https://github.com/LoganBaird-Levenick/portfree/blob/main/SECURITY.md) instead of opening a public issue.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: I am reporting a reproducible problem, not a security vulnerability or a support question.
          required: true
        - label: I am running the latest published release or a build of the current `main` branch.
          required: true

  - type: input
    id: version
    attributes:
      label: Portfree version
      description: The version shown in the release you downloaded, or the commit you built.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you get Portfree?
      options:
        - GitHub Release zip
        - Standalone portfree.exe from GitHub Releases
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: The exact version and build number. Run `winver` if you are unsure.
      placeholder: "Windows 11 24H2 (OS build 26100.4061)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands and inputs, in order. Include the port and any flags you used.
      placeholder: |
        1. Start a listener on port 3000.
        2. Run `portfree 3000 --dry-run`.
        3. ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the outcome and exit code if the command completed.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste the command output, error message, or JSON. Remove anything sensitive first.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help, such as whether the terminal was elevated, the shell you used, or antivirus/firewall software.
