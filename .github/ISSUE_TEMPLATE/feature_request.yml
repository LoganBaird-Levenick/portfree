name: Feature request
description: Suggest a new capability or a change to how Portfree behaves
title: "feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem first; a proposal is easier to evaluate when we understand the workflow it improves.

        If this is a security vulnerability, report it privately through [SECURITY.md](https://github.com/LoganBaird-Levenick/portfree/blob/main/SECURITY.md) instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched the existing issues and did not find an equivalent request.
          required: true
        - label: This request is about Portfree itself, not about an unrelated tool or a general Windows question.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that is difficult today and why the current behavior falls short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Portfree do? Include the command line, output, or outcome you expect if you have a concrete shape in mind.
      render: shell
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, including workarounds you already use.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, screenshots, or related issues that would help evaluate the request.
