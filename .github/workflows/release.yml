name: Release

on:
  push:
    tags: [portfree-v*]
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, for example 1.0.0. A portfree-v prefix is accepted.
        required: true
        type: string
      dry_run:
        description: Leave the release as a draft and do not publish it.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      HEAD_SHA: ${{ github.sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out the release ref
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup install

      - name: Verify the pinned toolchain
        shell: pwsh
        run: |
          $pinned = (Select-String -Path rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $active = ((rustup show active-toolchain) -split ' ')[0]
          rustc --version
          cargo --version
          if (-not $active.StartsWith($pinned)) {
            throw "Active toolchain '$active' does not match the pinned channel '$pinned'"
          }

      # The tag is the source of release truth. This step validates it but never
      # creates or pushes one: cargo-release owns version bumps and tags.
      - name: Resolve the release version
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:EVENT_NAME -eq 'push') {
            $tag = $env:REF_NAME
            $dryRun = $false
          } else {
            $input = $env:INPUT_VERSION.Trim()
            if ($input -match '^portfree-v(?<version>.+)$') {
              $version = $Matches['version']
            } else {
              $version = $input
            }
            if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
              throw "Invalid version '$input'. Pass a semantic version such as 1.0.0 or a tag such as portfree-v1.0.0."
            }
            $tag = "portfree-v$version"
            $dryRun = $env:INPUT_DRY_RUN -eq 'true'
          }

          if ($tag -notmatch '^portfree-v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' does not match the portfree-v{version} convention."
          }
          $version = $Matches['version']

          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne $tag) {
            throw "Checked-out tag '$env:REF_NAME' does not match the release tag '$tag'."
          }

          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'portfree' }
          if (-not $package) {
            throw 'The portfree package was not found in the workspace.'
          }
          if ($package.version -ne $version) {
            throw "Cargo.toml declares portfree $($package.version), but the release tag is $tag. Run cargo release instead of tagging by hand."
          }

          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and -not $dryRun) {
            git fetch --tags --force origin
            $tagCommit = (git rev-parse "$tag^{commit}" 2>$null)
            if ($LASTEXITCODE -ne 0) {
              throw "Tag '$tag' does not exist. Run cargo release to create and push it; this workflow never creates tags."
            }
            if ($tagCommit.Trim() -ne $env:HEAD_SHA) {
              throw "Tag '$tag' points at $($tagCommit.Trim()), not the dispatched commit $env:HEAD_SHA."
            }
          }

          $asset = "portfree-v$version-x86_64-pc-windows-msvc"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DRY_RUN=$($dryRun.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "dry_run=$($dryRun.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Release tag: $tag"
          Write-Host "Release asset: $asset"
          Write-Host "Dry run: $dryRun"

      # GitHub only issues build-provenance attestations for public repositories
      # on a user-owned repo. A private dry run can still verify the artifacts,
      # but a real release must not publish an unattested build.
      - name: Check attestation availability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $visibility = gh api "repos/$env:GITHUB_REPOSITORY" --jq .visibility
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the visibility of $env:GITHUB_REPOSITORY."
          }
          $attestations = $visibility -eq 'public'
          if (-not $attestations -and $env:DRY_RUN -ne 'true') {
            throw 'Build provenance attestations require a public repository. Refusing to publish an unattested release from a private repository.'
          }
          if (-not $attestations) {
            Write-Warning 'Repository is private; skipping build provenance attestations for this dry run.'
          }
          "ATTESTATIONS=$($attestations.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run the full test suite
        run: cargo test --all-targets --locked

      - name: Build the release binary
        run: cargo build --release --locked --bin portfree

      - name: Package the release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stage = "dist/$env:ASSET"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/portfree.exe "$stage/portfree.exe"
          Copy-Item README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE"

          Compress-Archive -Path $stage -DestinationPath "dist/$env:ASSET.zip" -Force
          Copy-Item target/release/portfree.exe dist/portfree.exe

          $lines = @("$env:ASSET.zip", 'portfree.exe') | ForEach-Object {
            $hash = (Get-FileHash (Join-Path dist $_) -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          }
          Set-Content -Path dist/SHA256SUMS -Value $lines -Encoding ascii

          Get-Content dist/SHA256SUMS
          Get-ChildItem dist | Select-Object Name, Length

      - name: Create or reuse the draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseJson = gh release view $env:TAG --json isDraft,url 2>$null | Out-String
          $exists = $LASTEXITCODE -eq 0

          if ($exists) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              "RELEASE_PUBLISHED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "Release $($env:TAG) is already published; it will be verified and left unchanged."
              return
            }
            Write-Host "Reusing the existing draft release at $($release.url)"
          } else {
            $createArgs = @(
              $env:TAG,
              '--draft',
              '--title', "Portfree $($env:TAG)",
              '--generate-notes'
            )
            if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              # A draft release does not create a git tag. The tag is only created
              # when the release is published, and publishing requires an existing
              # tag (checked above) or a tag-triggered run.
              $createArgs += @('--target', $env:HEAD_SHA)
            }
            gh release create @createArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create the draft release $($env:TAG)."
            }
          }

          "RELEASE_PUBLISHED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Attest the release artifacts
        if: env.ATTESTATIONS == 'true' && env.RELEASE_PUBLISHED != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/${{ env.ASSET }}.zip
            dist/portfree.exe

      - name: Upload the release assets
        if: env.RELEASE_PUBLISHED != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          gh release upload $env:TAG "dist/$env:ASSET.zip" dist/portfree.exe dist/SHA256SUMS --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the release assets for $($env:TAG)."
          }

      - name: Verify the release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $verify = 'verify'
          Remove-Item -Recurse -Force $verify -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $verify | Out-Null

          gh release download $env:TAG --dir $verify
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the release assets for $($env:TAG)."
          }

          $expectedNames = @("$env:ASSET.zip", 'portfree.exe')
          $sumsPath = Join-Path $verify 'SHA256SUMS'
          if (-not (Test-Path $sumsPath)) {
            throw 'SHA256SUMS is missing from the release.'
          }

          $sums = @{}
          Get-Content $sumsPath | ForEach-Object {
            if ($_ -match '^([0-9a-fA-F]{64})\s+\*?(.+)$') {
              $sums[$Matches[2]] = $Matches[1].ToLower()
            }
          }
          foreach ($name in $expectedNames) {
            if (-not $sums.ContainsKey($name)) {
              throw "SHA256SUMS does not cover $name."
            }
            $path = Join-Path $verify $name
            if (-not (Test-Path $path)) {
              throw "$name is missing from the release."
            }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $sums[$name]) {
              throw "Checksum mismatch for $name."
            }
            Write-Host "$name $actual"
          }

          if ($env:RELEASE_PUBLISHED -ne 'true') {
            $releaseSums = (Get-Content $sumsPath -Raw) -replace "`r`n", "`n"
            $localSums = (Get-Content dist/SHA256SUMS -Raw) -replace "`r`n", "`n"
            if ($releaseSums -ne $localSums) {
              throw 'SHA256SUMS in the release differs from the checksums generated by this run.'
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem -ErrorAction SilentlyContinue
          $zipPath = Join-Path $verify "$env:ASSET.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
          } finally {
            $archive.Dispose()
          }

          $expectedEntries = @(
            "$env:ASSET/portfree.exe",
            "$env:ASSET/README.md",
            "$env:ASSET/LICENSE"
          )
          $actualEntries = @($entries | Where-Object { $_ -and $_ -ne "$env:ASSET/" })
          $missing = @($expectedEntries | Where-Object { $_ -notin $actualEntries })
          $unexpected = @($actualEntries | Where-Object { $_ -notin $expectedEntries })
          if ($missing.Count -gt 0) {
            throw "The zip is missing: $($missing -join ', ')."
          }
          if ($unexpected.Count -gt 0) {
            throw "The zip contains unexpected entries: $($unexpected -join ', ')."
          }
          if ($entries | Where-Object { $_ -match 'test-listener' }) {
            throw 'The test fixture binary must never appear in a release artifact.'
          }

          $extract = Join-Path $verify 'extracted'
          Expand-Archive -Path $zipPath -DestinationPath $extract -Force
          $insideHash = (Get-FileHash (Join-Path $extract "$env:ASSET/portfree.exe") -Algorithm SHA256).Hash.ToLower()
          $standaloneHash = (Get-FileHash (Join-Path $verify 'portfree.exe') -Algorithm SHA256).Hash.ToLower()
          if ($insideHash -ne $standaloneHash) {
            throw 'The executable inside the zip differs from the standalone executable.'
          }

          if ($env:ATTESTATIONS -eq 'true') {
            gh attestation verify $zipPath --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw 'Build provenance for the zip did not verify.'
            }
            gh attestation verify (Join-Path $verify 'portfree.exe') --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw 'Build provenance for the standalone executable did not verify.'
            }
            $attestationSummary = '- Checksums, zip contents, and build provenance verified'
          } else {
            Write-Warning 'Skipping attestation verification for a private-repository dry run.'
            $attestationSummary = '- Checksums and zip contents verified; build provenance skipped for a private repository'
          }

          $releaseUrl = $null
          if ($env:RELEASE_PUBLISHED -ne 'true') {
            $releaseUrl = (gh release view $env:TAG --json url --jq .url)
          }
          $summary = @(
            '### Release verification',
            '',
            "- Tag: ``$env:TAG``",
            "- Zip: ``$($env:ASSET).zip``",
            "- Zip SHA-256: ``$($sums["$($env:ASSET).zip"])``",
            "- Executable SHA-256: ``$($sums['portfree.exe'])``",
            $attestationSummary,
            "- Draft release: $releaseUrl"
          ) -join "`n"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish the draft release
        if: env.RELEASE_PUBLISHED != 'true' && steps.meta.outputs.dry_run != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $release = gh release view $env:TAG --json isDraft | ConvertFrom-Json
          if ($release.isDraft) {
            gh release edit $env:TAG --draft=false
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish the release $($env:TAG)."
            }
            Write-Host "Published $($env:TAG)."
          } else {
            Write-Host "Release $($env:TAG) is already published."
          }
